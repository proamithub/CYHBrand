<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D0B4E"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="200" r="260" fill="#F59E0B" opacity="0.15"/>

  <g transform="translate(80, 80)">
    <rect width="360" height="52" rx="26" fill="url(#goldGrad)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" text-anchor="middle">FESTIVAL HEALTH &amp; CARE</text>
  </g>

  <text x="80" y="210" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800">Happy &amp; Healthy Diwali</text>
  <text x="80" y="265" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Doctor-Approved Tips for a Joyous, Safe &amp; Nourishing Festive Season</text>

  <g transform="translate(80, 390)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="65" cy="55" r="32" fill="#F59E0B" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#F59E0B"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">1. Practice Sweet Moderation</text>
    <text x="125" y="80" fill="#FEF3C7" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Choose roasted dry fruits over deep-fried sweets. Diabetics should space treats hours apart.</text>
  </g>

  <g transform="translate(80, 525)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="65" cy="55" r="32" fill="#F59E0B" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#F59E0B"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">2. Protect Eyes &amp; Lungs from Smoke</text>
    <text x="125" y="80" fill="#FEF3C7" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Asthma patients and elders should stay indoors during peak evening firecrackers. Keep inhalers handy.</text>
  </g>

  <g transform="translate(80, 660)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="65" cy="55" r="32" fill="#F59E0B" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#F59E0B"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">3. First Aid for Minor Burns</text>
    <text x="125" y="80" fill="#FEF3C7" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Immediately run cool tap water for 15 minutes. Never apply ice, toothpaste, or butter on burns.</text>
  </g>

  <g transform="translate(80, 810)" filter="url(#shadow)">
    <rect width="920" height="185" rx="24" fill="url(#goldGrad)"/>
    <circle cx="100" cy="92" r="54" fill="#FFFFFF"/>
    <circle cx="100" cy="92" r="48" fill="#2D0B4E"/>
    <text x="100" y="103" fill="#F59E0B" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" text-anchor="middle">DR</text>

    <text x="180" y="70" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Warm Wishes from Dr. Full Name &amp; Clinic Team</text>
    <text x="180" y="105" fill="#FFFBEB" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Wishing You and Your Loved Ones Health, Happiness &amp; Longevity</text>
    <rect x="180" y="125" width="690" height="40" rx="20" fill="#2D0B4E" opacity="0.4"/>
    <text x="200" y="151" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ðŸ“ž 24x7 Emergency Casualty &amp; Ambulance: +91 98765 43210</text>
  </g>
</svg>