    <text x="195" y="120" fill="#FFE4E6" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">Senior Pediatrician &amp; Newborn Specialist â€¢ Little Stars Clinic</text>
    <rect x="195" y="142" width="680" height="46" rx="23" fill="#0C4A6E" opacity="0.35"/>
