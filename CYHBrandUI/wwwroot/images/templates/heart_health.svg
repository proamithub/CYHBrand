<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="50%" stop-color="#0B1B3D"/>
      <stop offset="100%" stop-color="#142B58"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5A0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="150" r="260" fill="#0EA5A0" opacity="0.12"/>
  <circle cx="100" cy="900" r="240" fill="#0284C7" opacity="0.1"/>

  <path d="M 60 340 L 260 340 L 290 300 L 320 380 L 350 250 L 380 410 L 410 320 L 440 340 L 1020 340" 
        fill="none" stroke="#0EA5A0" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Top Pill Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="52" rx="26" fill="url(#tealGrad)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" text-anchor="middle">CARDIOLOGY &amp; HEART CARE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="210" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800">Healthy Heart Habits</text>
  <text x="80" y="265" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Clinical Guidelines for Healthy Blood Pressure &amp; Rhythm</text>

  <!-- 3 Tip Cards -->
  <g transform="translate(80, 390)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0EA5A0" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0EA5A0"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">1. Regular 30-Minute Aerobic Exercise</text>
    <text x="125" y="80" fill="#CBD5E1" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Brisk walking, swimming, or cycling lowers resting blood pressure by 5-8 mmHg.</text>
  </g>

  <g transform="translate(80, 525)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0EA5A0" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0EA5A0"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">2. Low Sodium &amp; Heart-Smart Diet</text>
    <text x="125" y="80" fill="#CBD5E1" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Limit salt intake to &lt; 5g/day. Add potassium-rich leafy vegetables and walnuts.</text>
  </g>

  <g transform="translate(80, 660)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0EA5A0" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0EA5A0"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">3. Routine BP &amp; Lipid Profile Monitoring</text>
    <text x="125" y="80" fill="#CBD5E1" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Check BP bi-weekly. Early detection prevents heart attacks and hypertensive crisis.</text>
  </g>

  <!-- Doctor Footer Ribbon -->
  <g transform="translate(80, 810)" filter="url(#shadow)">
    <rect width="920" height="185" rx="24" fill="url(#tealGrad)"/>
    <circle cx="100" cy="92" r="54" fill="#FFFFFF"/>
    <circle cx="100" cy="92" r="48" fill="#0B1B3D"/>
    <text x="100" y="103" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" text-anchor="middle">DR</text>

    <text x="180" y="70" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Dr. Full Name, MBBS, MD (Cardiology)</text>
    <text x="180" y="105" fill="#E0F2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Consultant Cardiologist &amp; Heart Specialist â€¢ City Hospital</text>
    <rect x="180" y="125" width="690" height="40" rx="20" fill="#0B1B3D" opacity="0.3"/>
    <text x="200" y="151" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ðŸ“ž Consultation &amp; OPD: +91 98765 43210  |  Mon - Sat: 10 AM - 6 PM</text>
  </g>
</svg>