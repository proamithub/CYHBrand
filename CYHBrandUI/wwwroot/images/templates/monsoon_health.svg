<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="200" r="260" fill="#38BDF8" opacity="0.12"/>

  <g transform="translate(80, 80)">
    <rect width="360" height="52" rx="26" fill="url(#blueGrad)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" text-anchor="middle">MONSOON HEALTH ALERT</text>
  </g>

  <text x="80" y="210" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800">Dengue &amp; Malaria Prevention</text>
  <text x="80" y="265" fill="#BAE6FD" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Essential Monsoon Precautions for Your Family's Health</text>

  <g transform="translate(80, 390)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0284C7" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0284C7"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">1. Eliminate Stagnant Water Around Homes</text>
    <text x="125" y="80" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Drain coolers, vases and open containers weekly. Aedes mosquitoes breed in clean water.</text>
  </g>

  <g transform="translate(80, 525)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0284C7" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0284C7"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">2. Apply Mosquito Repellents &amp; Full Sleeves</text>
    <text x="125" y="80" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Use DEET or Eucalyptus based sprays. Protect young children during sunrise and sunset.</text>
  </g>

  <g transform="translate(80, 660)" filter="url(#shadow)">
    <rect width="920" height="110" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="65" cy="55" r="32" fill="#0284C7" opacity="0.2"/>
    <circle cx="65" cy="55" r="14" fill="#0284C7"/>
    <text x="125" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">3. Drink Boiled Water &amp; Watch For High Fever</text>
    <text x="125" y="80" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18">Sudden high fever, eye pain or body rash requires urgent platelet &amp; CBC testing.</text>
  </g>

  <g transform="translate(80, 810)" filter="url(#shadow)">
    <rect width="920" height="185" rx="24" fill="url(#blueGrad)"/>
    <circle cx="100" cy="92" r="54" fill="#FFFFFF"/>
    <circle cx="100" cy="92" r="48" fill="#0F172A"/>
    <text x="100" y="103" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" text-anchor="middle">DR</text>

    <text x="180" y="70" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Dr. Full Name, MD (Internal Medicine)</text>
    <text x="180" y="105" fill="#E0F2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Infectious Disease &amp; General Physician â€¢ City Care Hospital</text>
    <rect x="180" y="125" width="690" height="40" rx="20" fill="#0F172A" opacity="0.35"/>
    <text x="200" y="151" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ðŸ“ž 24x7 Fever Helpline &amp; Lab: +91 98765 43210  |  Rapid Blood Tests</text>
  </g>
</svg>